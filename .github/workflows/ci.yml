name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Frontend API client matches the backend schema
        run: |
          uv run siqe openapi > /tmp/openapi.json
          diff -u ../frontend/openapi.json /tmp/openapi.json || {
            echo "::error::frontend/openapi.json is stale. Run 'make gen-api' and commit the result."; exit 1; }

  backend-ai:
    name: Backend AI (PyTorch tests with real model weights)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SIQE_TEST_MODELS: /tmp/models
    steps:
      - name: Free disk space for PyTorch
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra ai
      - name: Download small test weights (checksums from the manifest)
        run: |
          mkdir -p /tmp/models
          uv run python - <<'PY'
          import hashlib, urllib.request
          from siqe.ai.manifest import MODELS_BY_ID
          for model_id in ("realesr-general-x4v3", "siqe-classic"):
              f = MODELS_BY_ID[model_id].files[0]
              data = urllib.request.urlopen(f.url).read()
              assert hashlib.sha256(data).hexdigest() == f.sha256, f.name
              open(f"/tmp/models/{f.name}", "wb").write(data)
          PY
      - run: uv run pytest tests/unit/test_ai_torch.py tests/unit/test_faces.py tests/unit/test_tiling.py -v

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stack:
    name: Full stack (Docker Compose, integration and browser tests)
    needs: [backend, backend-ai, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space for the PyTorch image
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and start the stack
        run: |
          make env
          docker compose build
          docker compose up -d
          timeout 300 bash -c 'until curl -fsS http://localhost:8080/api/health/ready; do sleep 3; done'
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: API integration tests
        working-directory: backend
        run: uv sync --frozen && uv run pytest -m integration
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Browser tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Scan images for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ghcr.io/amerzuher/siqe-studio-api:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300
