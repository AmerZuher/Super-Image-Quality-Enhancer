[project]
name = "siqe"
version = "0.1.0"
description = "SIQE Studio backend: API, Temporal workers and CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Amer Zuher ALriahy" },
  { name = "Hisham Maher Sunjaq" },
]
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.31",
  "alembic>=1.20",
  "temporalio>=1.34",
  "structlog>=26.1",
  "httpx>=0.28",
  "packaging>=25",
  "psutil>=7.2",
  "typer>=0.27",
  "pyvips[binary]>=3.2",
  "pillow>=12.3",
]

[project.optional-dependencies]
# GPU / AI worker image only. The API image stays small without these.
ai = [
  "torch>=2.14",
  "nvidia-ml-py>=13.615",
]

[project.scripts]
siqe = "siqe.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "mypy>=2.3",
  "types-psutil",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siqe"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PTH"]
# RUF001/RUF002: "×" is intentional in user-facing sizes such as "7680 × 4320".
ignore = ["S101", "S311", "RUF012", "B008", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"src/siqe/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["siqe"]

[[tool.mypy.overrides]]
module = ["pyvips.*", "torch.*", "pynvml.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs the running stack (PostgreSQL, Temporal, workers)",
]
addopts = "-m 'not integration'"
